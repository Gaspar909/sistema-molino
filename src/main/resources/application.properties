spring.application.name=sistema-molino

# Configuración de la base de datos
spring.datasource.url=jdbc:mariadb://localhost:3306/molino_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# JPA / Hibernate - Code First
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Estrategia de nomenclatura: Java camelCase -> SQL snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

jwt.secret=7c4a8f3d2e1b6a5f9c8d7e6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f
jwt.expiration=86400000
